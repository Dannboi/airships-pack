	buried_vaultlet = 3
	#Pool weight of the oracle_shrine_wild ruin variant (0 = never generates)
	# Default: 1
	# Range: 0 ~ 100
	oracle_shrine_wild = 1
	#Pool weight of the basin_spire ruin variant (0 = never generates)
	# Default: 3
	# Range: 0 ~ 100
	basin_spire = 3
	#Pool weight of the basin_bridge ruin variant (0 = never generates)
	# Default: 3
	# Range: 0 ~ 100
	basin_bridge = 3
	#Pool weight of the basin_drum ruin variant (0 = never generates)
	# Default: 3
	# Range: 0 ~ 100
	basin_drum = 3
	#Pool weight of the standing_ring ruin variant (0 = never generates)
	# Default: 2
