[items]
	#Entity IDs the Green Eco Reliquary is NOT allowed to capture, e.g. "minecraft:villager".
	#Bosses and anything the Blue Eco Levitator can't lift (the precursory:levitator_immune
	#entity tag and mobs over 150 max health) are ALWAYS excluded on top of this list.
	reliquaryBlacklist = []
