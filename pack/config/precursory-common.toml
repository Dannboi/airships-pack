	#Pool weight of the collapsed_arch ruin variant (0 = never generates)
	# Default: 4
	# Range: 0 ~ 100
	collapsed_arch = 4
	#Pool weight of the buried_vaultlet ruin variant (0 = never generates)
	# Default: 3
