[aesthetics]
	#Legacy: [aesthetics] Custom Apparel Model
	#Determines if some work apparel (like aprons and clothing) use special models
	custom_apparel_model = true
	#Legacy: [aesthetics] MFR Custom Animations
	#Should MFR Custom animations for things like counterattacks after parries and spear and halberd animations occur, true or false. Disable if you are using a mod that adds custom animations for such things, as it mess them up.
	mfr_custom_animations = true

[armour_rating_positioning]
	#Legacy: [armour rating positioning] X Orient
	#The orientation for the X axis (-1 = left, 0 = middle, 1 = right). Determines what point in the axis to snap to
	# Default: -1
	# Range: > -2147483648
	x_orient = -1
	#Legacy: [armour rating positioning] X Position
	#The Offset value away from the orient (-)left, (+)right
	# Default: 4
	# Range: > -2147483648
	x_position = 4
	#Legacy: [armour rating positioning] Y Orient
	#The orientation for the Y axis (-1 = top, 0 = middle, 1 = bottom). Determines what point in the axis to snap to
	# Default: -1
	# Range: > -2147483648
	y_orient = -1
	#Legacy: [armour rating positioning] Y Position
	#The Offset value away from the orient (-)up, (+)down
	# Default: 4
	# Range: > -2147483648
	y_position = 4

[arrow_count_positioning]
	#Legacy: [arrow count positioning] X Orient
	#The orientation for the X axis (-1 = left, 0 = middle, 1 = right). Determines what point in the axis to snap to
	# Default: -1
	# Range: > -2147483648
