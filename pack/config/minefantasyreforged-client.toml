	# Range: > -2147483648
	x_position = 4
	#Legacy: [arrow count positioning] Y Orient
	#The orientation for the Y axis (-1 = top, 0 = middle, 1 = bottom). Determines what point in the axis to snap to
	# Default: -1
	# Range: > -2147483648
	y_orient = -1
	#Legacy: [arrow count positioning] Y Position
	#The Offset value away from the orient (-)up, (+)down
	# Default: 4
	# Range: > -2147483648
	y_position = 4

[clockwork_armour_fuel_positioning]
	#Legacy: [clockwork armour fuel positioning] X Orient
	#The orientation for the X axis (-1 = left, 0 = middle, 1 = right). Determines what point in the axis to snap to
	# Default: 1
	# Range: > -2147483648
	x_orient = 1
	#Legacy: [clockwork armour fuel positioning] X Position
