#Alex's Preserves — controls which mobs may naturally spawn inside Alex's Caves biomes.
[general]
	#Entity IDs that are allowed to spawn in protected biomes.
	#Format: "modid:entity_name"  (e.g. "minecraft:bat")
	#Mobs from Alex's Caves are always allowed; this list adds exceptions.
	allowedEntities = []
	#Whole mod namespaces that are allowed to spawn in protected biomes.
	#Default includes "minecraft" because Alex's Caves biomes reuse many vanilla mobs.
	#Remove it if you want a stricter preserve.
	allowedNamespaces = ["minecraft"]
	#Specific biome IDs to protect in addition to the namespace match below.
	#Format: "modid:biome_name"
	protectedBiomes = []
	#Biome namespaces to protect. Defaults to "alexscaves".
	#Any biome whose namespace matches becomes a preserve.
	protectedNamespaces = ["alexscaves"]
